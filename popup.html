<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>TrueSight UI</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup">
    <button id="toggle-btn" class="toggle off">
      <img src="icons/TrueSightUI-icon-ON-128.png" alt="TrueSight UI" class="logo">
      <span id="toggle-label">Enable TrueSight UI</span>
    </button>

    <div class="footer">
      <a id="support-link" href="#" target="_blank" rel="noopener noreferrer">
        <img src="icons/kofi.webp" alt="Ko-fi" class="kofi-icon">
        Buy me a coffee
      </a>
      <button id="options-btn" class="options-btn" title="Options">
        options
      </button>
    </div>

    <div id="options-panel" class="options-panel hidden">

      <div class="options-list">

        <label class="option-item">
          <span>Custom Cursor</span>
          <label class="switch">
            <input type="checkbox" id="opt-cursor" checked>
            <span class="slider round"></span>
          </label>
        </label>

        <label class="option-item">
          <span>Hide Primary Box Filters</span>
          <label class="switch">
            <input type="checkbox" id="opt-filters" checked>
            <span class="slider round"></span>
          </label>
        </label>

        <label class="option-item">
          <span>Concentration Tracker</span>
          <label class="switch">
            <input type="checkbox" id="opt-concentration" checked>
            <span class="slider round"></span>
          </label>
        </label>

      </div>

      <div class="options-header">
        <span>TrueSight UI by KRNKFRD</span>
        <span id="version-label">v1.0.0</span>
      </div>

      <p class="credits">Icons provided under the
        <a class="game-icons-link" href="https://creativecommons.org/licenses/by/3.0" target="_blank">CC BY 3.0</a> by
        <a class="game-icons-link" href="https://game-icons.net" target="_blank">GameIcons</a>:
        <a class="game-icons-link" href="https://game-icons.net/1x1/lorc/beast-eye.html" target="_blank">Beast eye</a> +
        <a class="game-icons-link" href="https://game-icons.net/1x1/lorc/relic-blade.html" target="_blank">Relic
          blade</a> by
        <a class="game-icons-link" href="https://lorcblog.blogspot.com" target="_blank">Lorc</a>.
        <a class="game-icons-link" href="https://game-icons.net/1x1/delapouite/mighty-force.html" target="_blank">Mighty
          force</a> and
        <a class="game-icons-link" href="https://game-icons.net/1x1/delapouite/mimic-chest.html" target="_blank">Mimic
          chest</a> by
        <a class="game-icons-link" href="https://delapouite.com" target="_blank">Delapouite</a>.
        <a class="game-icons-link" href="https://game-icons.net/1x1/cathelineau/swordman.html"
          target="_blank">Swordman</a> by Cathelineau.
      </p>

      <img id="party-wizard" src="icons/wizard.png" alt="Party Mode" title="Party Mode">

    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
